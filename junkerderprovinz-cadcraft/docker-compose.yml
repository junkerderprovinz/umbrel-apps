version: '3.7'
services:
  app_proxy:
    environment:
      APP_HOST: junkerderprovinz-cadcraft_cadcraft_1
      APP_PORT: '3000'
  cadcraft:
    image: junkerderprovinz/cadcraft:latest
    restart: on-failure
    shm_size: 1gb
    volumes:
    - ${APP_DATA_DIR}/data:/config
    - ${UMBREL_ROOT}/data/storage:/storage
    environment:
      TZ: Europe/Vienna
      PUID: '1000'
      PGID: '1000'
      UMASK: '022'
    labels:
      homepage.href: ''
      homepage.group: Productivity
      homepage.name: CADCraft
      homepage.icon: https://raw.githubusercontent.com/junkerderprovinz/unraid-apps/main/cadcraft/icon.png
      homepage.description: 2D drafting with DXF and DWG in the browser
      glance.name: CADCraft
      glance.icon: https://raw.githubusercontent.com/junkerderprovinz/unraid-apps/main/cadcraft/icon.png
      glance.description: 2D drafting with DXF and DWG in the browser
