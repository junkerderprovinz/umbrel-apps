version: '3.7'
services:
  app_proxy:
    environment:
      APP_HOST: junkerderprovinz-lightcraft_lightcraft_1
      APP_PORT: '3000'
  lightcraft:
    image: junkerderprovinz/lightcraft:latest
    restart: on-failure
    shm_size: 1gb
    volumes:
    - ${APP_DATA_DIR}/data:/config
    - ${UMBREL_ROOT}/data/storage:/storage
    environment:
      TZ: Europe/Vienna
      PUID: '1000'
      PGID: '1000'
      UMASK: '022'
    labels:
      homepage.href: ''
      homepage.group: Media
      homepage.name: LightCraft
      homepage.icon: https://raw.githubusercontent.com/junkerderprovinz/unraid-apps/main/lightcraft/icon.png
      homepage.description: Photo library and raw developer
      glance.name: LightCraft
      glance.icon: https://raw.githubusercontent.com/junkerderprovinz/unraid-apps/main/lightcraft/icon.png
      glance.description: Photo library and raw developer
