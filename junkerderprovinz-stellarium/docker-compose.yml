version: '3.7'
services:
  app_proxy:
    environment:
      APP_HOST: junkerderprovinz-stellarium_stellarium_1
      APP_PORT: '3000'
  stellarium:
    image: junkerderprovinz/stellarium:latest
    restart: on-failure
    shm_size: 1gb
    volumes:
    - ${APP_DATA_DIR}/data:/config
    environment:
      TZ: Europe/Vienna
      PUID: '1000'
      PGID: '1000'
      UMASK: '022'
