version: '3.7'
services:
  app_proxy:
    environment:
      APP_HOST: junkerderprovinz-featherdrop_featherdrop_1
      APP_PORT: '3000'
      PROXY_AUTH_ADD: 'false'
  featherdrop:
    image: junkerderprovinz/featherdrop:latest
    restart: on-failure
    volumes:
    - ${APP_DATA_DIR}/data/data:/data
    - ${APP_DATA_DIR}/data/config:/config
    environment:
      CONFIG_DIR: /config
      DEFAULT_EXPIRY: 7d
      MAX_FILE_SIZE: '0'
      MAX_EXPIRY: never
      STORAGE_QUOTA: '0'
      RATE_LIMIT: 'true'
      TRUST_PROXY: 'false'
