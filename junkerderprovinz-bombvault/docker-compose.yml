version: '3.7'
services:
  app_proxy:
    environment:
      APP_HOST: junkerderprovinz-bombvault_bombvault_1
      APP_PORT: '3000'
  bombvault:
    image: junkerderprovinz/bombvault:latest
    restart: on-failure
    hostname: bombvault
    volumes:
    - ${APP_DATA_DIR}/data:/config
    - ${UMBREL_ROOT}:/host/user
    - /var/run/docker.sock:/var/run/docker.sock
    environment:
      HTTP_ONLY: 'true'
      APP_KEY: ${APP_SEED}
      HOST_SOURCE_ROOT: ${UMBREL_ROOT}
      LIBVIRT_HOST: 192.168.x.x
      LIBVIRT_SSH_PORT: '22'
      LIBVIRT_SSH_USER: root
      PLATFORM: generic
      DATA_ROOT_SEGMENTS: app-data
    labels:
      homepage.href: ''
      homepage.group: Backup
      homepage.name: BombVault
      homepage.icon: https://raw.githubusercontent.com/junkerderprovinz/bombvault/main/.github/assets/icon.png?v=6
      homepage.description: Backup and disaster recovery for containers and VMs
      glance.name: BombVault
      glance.icon: https://raw.githubusercontent.com/junkerderprovinz/bombvault/main/.github/assets/icon.png?v=6
      glance.description: Backup and disaster recovery for containers and VMs
    extra_hosts:
    - host.docker.internal:host-gateway
