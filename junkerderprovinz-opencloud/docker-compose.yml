version: '3.7'
services:
  app_proxy:
    environment:
      APP_HOST: junkerderprovinz-opencloud_opencloud_1
      APP_PORT: '9200'
      PROXY_AUTH_ADD: 'false'
  opencloud:
    image: junkerderprovinz/opencloud:rolling
    restart: on-failure
    volumes:
    - ${APP_DATA_DIR}/data/config:/etc/opencloud
    - ${APP_DATA_DIR}/data/data:/var/lib/opencloud
    environment:
      IDM_ADMIN_PASSWORD: ${APP_PASSWORD}
      OC_URL: http://${DEVICE_DOMAIN_NAME}:35111
      OC_INSECURE: 'true'
      OC_LOG_LEVEL: info
      IDM_CREATE_DEMO_USERS: 'false'
      PROXY_TLS: 'false'
      PROXY_ENABLE_APP_AUTH: 'false'
      BRANDING_APP: 'false'
      PUID: '1000'
      PGID: '1000'
      STORAGE_USERS_DRIVER: posix
      STORAGE_USERS_DECOMPOSEDS3_REGION: default
      OFFICE: 'off'
      FULLTEXT_SEARCH: 'false'
