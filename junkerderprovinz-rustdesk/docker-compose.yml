version: '3.7'
services:
  app_proxy:
    environment:
      APP_HOST: junkerderprovinz-rustdesk_rustdesk_1
      APP_PORT: '21114'
      PROXY_AUTH_ADD: 'false'
  rustdesk:
    image: junkerderprovinz/rustdesk:latest
    restart: on-failure
    volumes:
    - ${APP_DATA_DIR}/data:/data
    - ${APP_DATA_DIR}/data/api:/app/data
    environment:
      RELAY: ${DEVICE_DOMAIN_NAME}:21117
      RUSTDESK_API_RUSTDESK_ID_SERVER: ${DEVICE_DOMAIN_NAME}:21116
      RUSTDESK_API_RUSTDESK_RELAY_SERVER: ${DEVICE_DOMAIN_NAME}:21117
      RUSTDESK_API_RUSTDESK_API_SERVER: http://${DEVICE_DOMAIN_NAME}:35135
      ENCRYPTED_ONLY: '1'
      MUST_LOGIN: N
      RUSTDESK_API_LANG: en
      TZ: Europe/Vienna
    ports:
    - 21115:21115
    - 21116:21116
    - 21116:21116/udp
    - 21117:21117
    - 21118:21118
    - 21119:21119
