version: '3.7'
services:
  app_proxy:
    environment:
      APP_HOST: junkerderprovinz-photocraft_photocraft_1
      APP_PORT: '3000'
  photocraft:
    image: junkerderprovinz/photocraft:latest
    restart: on-failure
    shm_size: 1gb
    volumes:
    - ${APP_DATA_DIR}/data:/config
    - ${UMBREL_ROOT}/data/storage:/storage
    environment:
      TZ: Europe/Vienna
      PUID: '1000'
      PGID: '1000'
      UMASK: '022'
    labels:
      homepage.href: ''
      homepage.group: Media
      homepage.name: PhotoCraft
      homepage.icon: https://raw.githubusercontent.com/junkerderprovinz/unraid-apps/main/photocraft/icon.png
      homepage.description: Layered photo editor in the browser
      glance.name: PhotoCraft
      glance.icon: https://raw.githubusercontent.com/junkerderprovinz/unraid-apps/main/photocraft/icon.png
      glance.description: Layered photo editor in the browser
