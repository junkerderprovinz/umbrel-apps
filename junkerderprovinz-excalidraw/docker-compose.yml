version: '3.7'
services:
  app_proxy:
    environment:
      APP_HOST: junkerderprovinz-excalidraw_excalidraw_1
      APP_PORT: '80'
  excalidraw:
    image: junkerderprovinz/excalidraw:latest
    restart: on-failure
    volumes:
    - ${APP_DATA_DIR}/data:/config
    environment:
      ENABLE_LIBRARY: 'false'
      ENABLE_AI: 'false'
      TZ: Europe/Berlin
