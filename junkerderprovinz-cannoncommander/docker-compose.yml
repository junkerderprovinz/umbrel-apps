version: '3.7'
services:
  app_proxy:
    environment:
      APP_HOST: junkerderprovinz-cannoncommander_cannoncommander_1
      APP_PORT: '80'
      PROXY_AUTH_ADD: 'false'
  cannoncommander:
    image: junkerderprovinz/cannoncommander:latest
    restart: on-failure
    hostname: cannoncommander
    volumes:
    - ${APP_DATA_DIR}/data:/config
    - ${UMBREL_ROOT}/data/storage:/mnt/user
    environment:
      PUID: '1000'
      PGID: '1000'
      UMASK: '022'
      TZ: Europe/Berlin
      CC_UNRAID_SOCKET: 'false'
    devices:
    - /dev/fuse
    cap_add:
    - SYS_ADMIN
    - DAC_READ_SEARCH
    - DAC_OVERRIDE
    security_opt:
    - apparmor:unconfined
