version: '3.7'
services:
  app_proxy:
    environment:
      APP_HOST: junkerderprovinz-securo_securo_1
      APP_PORT: '8080'
  securo:
    image: junkerderprovinz/securo:latest
    restart: on-failure
    volumes:
    - ${APP_DATA_DIR}/data:/data
    environment:
      BUILTIN_POSTGRES: 'true'
      POSTGRES_USER: postgres
      BUILTIN_REDIS: 'true'
      REGISTRATION_ENABLED: 'true'
      POSTGRES_PORT: '5432'
      POSTGRES_DB: securo
      REDIS_PORT: '6379'
      REDIS_DB: '0'
      TRUSTED_PROXY_HOPS: '1'
      SIMPLEFIN_ENABLED: 'false'
      SIMPLEFIN_API_URL: https://beta-bridge.simplefin.org
      OIDC_ENABLED: 'false'
      OIDC_PROVIDER_NAME: OIDC
      LOCAL_AUTH_ENABLED: 'true'
      PUID: '1000'
      PGID: '1000'
