version: '3.7'
services:
  app_proxy:
    environment:
      APP_HOST: junkerderprovinz-seafile_seafile_1
      APP_PORT: '80'
      PROXY_AUTH_ADD: 'false'
  seafile:
    image: junkerderprovinz/seafile:latest
    restart: on-failure
    volumes:
    - ${APP_DATA_DIR}/data:/shared
    environment:
      SEAFILE_SERVER_HOSTNAME: ${DEVICE_DOMAIN_NAME}:35114
      SEAFILE_SERVER_PROTOCOL: http
      INIT_SEAFILE_ADMIN_EMAIL: admin@example.com
      BUILTIN_MARIADB: 'true'
      BUILTIN_REDIS: 'true'
      ENABLE_NOTIFICATION_SERVER: 'false'
      SEAFILE_MYSQL_DB_PORT: '3306'
      SEAFILE_MYSQL_DB_USER: seafile
      SEAFILE_MYSQL_DB_CCNET_DB_NAME: ccnet_db
      SEAFILE_MYSQL_DB_SEAFILE_DB_NAME: seafile_db
      SEAFILE_MYSQL_DB_SEAHUB_DB_NAME: seahub_db
      REDIS_PORT: '6379'
      OFFICE: 'off'
      ENABLE_SEADOC: 'false'
