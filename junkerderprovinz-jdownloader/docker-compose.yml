version: '3.7'
services:
  app_proxy:
    environment:
      APP_HOST: junkerderprovinz-jdownloader_jdownloader_1
      APP_PORT: '3000'
  jdownloader:
    image: junkerderprovinz/jdownloader:latest
    restart: on-failure
    shm_size: 1gb
    volumes:
    - ${APP_DATA_DIR}/data:/config
    - ${UMBREL_ROOT}/data/storage/downloads:/downloads
    environment:
      JD_THEME: Dark
      JD_ACCENT: '#ffee00'
      JD_SELFUPDATE: 'true'
      JD_ENABLE_BROWSER: auto
      TZ: Europe/Vienna
      PUID: '1000'
      PGID: '1000'
      UMASK: '022'
