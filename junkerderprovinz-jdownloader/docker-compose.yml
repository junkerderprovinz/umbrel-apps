version: '3.7'
services:
  app_proxy:
    environment:
      APP_HOST: junkerderprovinz-jdownloader_jdownloader_1
      APP_PORT: '3000'
  jdownloader:
    image: junkerderprovinz/jdownloader:latest
    restart: on-failure
    shm_size: 1gb
    volumes:
    - ${APP_DATA_DIR}/data:/config
    - ${UMBREL_ROOT}/data/storage/downloads:/downloads
    environment:
      JD_THEME: jd-highlighter-dark
      JD_SELFUPDATE: 'true'
      JD_ENABLE_BROWSER: auto
      TZ: Europe/Vienna
      PUID: '1000'
      PGID: '1000'
      UMASK: '022'
    labels:
      homepage.href: ''
      homepage.group: Downloads
      homepage.name: JDownloader
      homepage.icon: https://raw.githubusercontent.com/junkerderprovinz/unraid-apps/main/jdownloader/icon.png
      homepage.description: Download manager on a web desktop
      glance.name: JDownloader
      glance.icon: https://raw.githubusercontent.com/junkerderprovinz/unraid-apps/main/jdownloader/icon.png
      glance.description: Download manager on a web desktop
