version: '3.7'
services:
  app_proxy:
    environment:
      APP_HOST: junkerderprovinz-krusader_krusader_1
      APP_PORT: '3000'
  krusader:
    image: junkerderprovinz/krusader:latest
    restart: on-failure
    shm_size: 1gb
    volumes:
    - ${APP_DATA_DIR}/data:/config
    - ${UMBREL_ROOT}/data/storage:/storage
    environment:
      KRUSADER_LANG: de = Deutsch
      KRUSADER_THEME: dark
      KEYBOARD_LAYOUT: us
      TZ: Europe/Vienna
      PUID: '1000'
      PGID: '1000'
      UMASK: '022'
