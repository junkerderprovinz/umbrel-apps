version: '3.7'
services:
  app_proxy:
    environment:
      APP_HOST: junkerderprovinz-prusaslicer_prusaslicer_1
      APP_PORT: '3000'
  prusaslicer:
    image: junkerderprovinz/prusaslicer:latest
    restart: on-failure
    shm_size: 1gb
    volumes:
    - ${APP_DATA_DIR}/data:/config
    - ${UMBREL_ROOT}/data/storage:/storage
    environment:
      TZ: Europe/Vienna
      PUID: '1000'
      PGID: '1000'
      UMASK: '022'
    labels:
      homepage.href: ''
      homepage.group: Tools
      homepage.name: PrusaSlicer
      homepage.icon: https://raw.githubusercontent.com/junkerderprovinz/unraid-apps/main/prusaslicer/icon.png?v=3
      homepage.description: 3D-printing slicer in the browser
      glance.name: PrusaSlicer
      glance.icon: https://raw.githubusercontent.com/junkerderprovinz/unraid-apps/main/prusaslicer/icon.png?v=3
      glance.description: 3D-printing slicer in the browser
