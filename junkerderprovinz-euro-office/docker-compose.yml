version: '3.7'
services:
  app_proxy:
    environment:
      APP_HOST: junkerderprovinz-euro-office_euro-office_1
      APP_PORT: '80'
      PROXY_AUTH_ADD: 'false'
  euro-office:
    image: ghcr.io/junkerderprovinz/euro-office:latest
    restart: on-failure
    volumes:
    - ${APP_DATA_DIR}/data/data:/var/www/euro-office/Data
    - ${APP_DATA_DIR}/data/certs:/certs:ro
    environment:
      JWT_SECRET: ${APP_PASSWORD}
      WOPI_ENABLED: 'true'
      JWT_ENABLED: 'true'
      USE_UNAUTHORIZED_STORAGE: 'true'
      ONLYOFFICE_HTTPS_HSTS_ENABLED: 'true'
    ports:
    - 35201:443
