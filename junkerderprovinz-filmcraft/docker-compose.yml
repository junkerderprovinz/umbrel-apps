version: '3.7'
services:
  app_proxy:
    environment:
      APP_HOST: junkerderprovinz-filmcraft_filmcraft_1
      APP_PORT: '3000'
  filmcraft:
    image: junkerderprovinz/filmcraft:latest
    restart: on-failure
    shm_size: 1gb
    volumes:
    - ${APP_DATA_DIR}/data:/config
    - ${UMBREL_ROOT}/data/storage:/storage
    environment:
      TZ: Europe/Vienna
      PUID: '1000'
      PGID: '1000'
      UMASK: '022'
